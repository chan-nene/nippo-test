<!doctype html>
<html lang="ja" class="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; media-src 'none'; worker-src 'none'"
    />
    <title>NIPPO | Daily Report</title>

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./reports.css" />
    <link rel="stylesheet" href="./settings.css" />
    <link rel="stylesheet" href="./admin.css" />
  </head>
  <body>
    <header class="title-bar">
      <div class="title-bar-brand">
        <span class="brand-mark" aria-hidden="true">
          <svg

            viewBox="0 0 512 512"
            xml:space="preserve"
          >

              <polygon

          </svg>
        </span>
        <span class="title-bar-title">NIPPO</span>
      </div>
      <div class="title-bar-actions" aria-label="アプリ操作">
        <span class="current-user-display">
          <span class="current-user-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="8" r="4" />
              <path d="M4 21a8 8 0 0 1 16 0" />
            </svg>
          </span>
          <span id="currentUserName" class="current-user">ユーザー</span>
        </span>
        <div id="fontSizeControl" class="font-size-control">
          <button
            id="fontSizeButton"
            class="header-icon-button font-size-button"
            type="button"
            aria-label="文字サイズを変更"
            aria-haspopup="true"
            aria-expanded="false"
          >
            Aa
          </button>
          <div
            id="fontSizeMenu"
            class="font-size-menu hidden"
            role="group"
            aria-label="文字サイズ"
          >
            <button type="button" data-font-size="compact" aria-pressed="false">極小</button>
            <button type="button" data-font-size="standard" aria-pressed="false">小</button>
            <button type="button" data-font-size="medium" aria-pressed="false">中</button>
            <button type="button" data-font-size="large" aria-pressed="true">大</button>
            <button type="button" data-font-size="xlarge" aria-pressed="false">極大</button>
          </div>
        </div>
      </div>
    </header>

    <div class="app-shell">
      <aside id="sidebar" class="sidebar is-open">
        <nav class="sidebar-nav" aria-label="メインメニュー">
          <ul>
            <li>
              <button
                id="dailyViewButton"
                class="sidebar-item is-active"
                type="button"
                title="日報"
              >
                <span class="sidebar-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" role="img">
                    <path d="M12 20h9" />
                    <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
                  </svg>
                </span>
                <span class="sidebar-text">日報</span>
              </button>
            </li>
          </ul>
        </nav>
        <nav class="sidebar-secondary-nav" aria-label="アプリ設定">
          <button
            id="adminViewButton"
            class="sidebar-item"
            type="button"
            title="共通マスター"
          >
            <span class="sidebar-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="img">
                <ellipse cx="12" cy="5" rx="8" ry="3" />
                <path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5" />
                <path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6" />
              </svg>
            </span>
            <span class="sidebar-text">共通マスター</span>
          </button>
          <button
            id="openSettingsButton"
            class="sidebar-item"
            type="button"
            title="設定"
          >
            <span class="sidebar-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="img">
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.51a2 2 0 0 1 1-1.72l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </span>
            <span class="sidebar-text">設定</span>
          </button>
        </nav>
        <div id="sidebar-toggle-container" class="sidebar-footer">
          <button
            id="toggleSidebarButton"
            class="sidebar-utility-button sidebar-toggle"
            type="button"
            title="サイドバーを閉じる"
            aria-label="サイドバー切替"
          >
            <span class="sidebar-toggle-icon" aria-hidden="true"></span>
            <span class="sidebar-utility-text">折りたたむ</span>
          </button>
        </div>
      </aside>

      <main class="main-area">
        <div id="statusRegion" class="status-region" aria-live="polite">
          <div id="message" class="message hidden" role="status">
            <span id="messageText" class="message-text"></span>
            <button
              id="dismissToastButton"
              class="message-close-button"
              type="button"
              aria-label="通知を閉じる"
              data-allow-when-busy
            >×</button>
          </div>
        </div>
        <section id="mainPanel" class="content">
          <div id="reportPanel" class="workspace-card">
            <div class="report-toolbar">
              <div class="toolbar-row toolbar-filter-row">
                <div class="toolbar-left toolbar-left-wide">
                  <div class="period-control-container">
                      <div class="period-control">
                        <div class="period-field-group">
                          <input id="startDate" type="date" aria-label="開始日" aria-describedby="periodError" />
                        </div>
                        <span class="period-separator">〜</span>
                        <div class="period-field-group">
                          <input id="endDate" type="date" aria-label="終了日" aria-describedby="periodError" />
                        </div>
                      </div>
                      <div id="periodError" class="field-error period-error hidden" role="alert"></div>
                  </div>
                </div>
                <div class="period-main-controls">
                    <div class="period-mode-control">
                      <div class="period-presets" role="group" aria-label="表示期間">
                        <button
                          id="presetMonthButton"
                          class="preset-button"
                          type="button"
                          aria-pressed="false"
                        >
                          月
                        </button>
                        <button
                          id="presetWeekButton"
                          class="preset-button"
                          type="button"
                          aria-pressed="false"
                        >
                          週
                        </button>
                        <button
                          id="presetDayButton"
                          class="preset-button"
                          type="button"
                          aria-pressed="false"
                        >
                          日
                        </button>
                        <button
                          id="presetDefaultButton"
                          class="preset-button"
                          type="button"
                          aria-pressed="false"
                        >
                          設定範囲
                        </button>
                      </div>
                    </div>
                    <div class="period-navigation" role="group" aria-label="表示期間を移動">
                      <button id="periodPrevButton" class="period-shift-button" type="button">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
                      </button>
                      <button id="periodNextButton" class="period-shift-button" type="button">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
                      </button>
                    </div>
                    <div
                      id="missingCommentsFilterGroup"
                      class="missing-filter-group hidden"
                    >
                      <span class="period-filter-divider" aria-hidden="true"></span>
                      <button
                        id="showMissingCommentsButton"
                        class="preset-button missing-filter-button"
                        type="button"
                        aria-pressed="false"
                      >
                        <span class="missing-filter-label">未確認のみ</span>
                        <span class="missing-count-badge is-empty" aria-hidden="true">0日</span>
                      </button>
                    </div>
                </div>
                <div class="toolbar-right">
                  <button
                    id="refreshButton"
                    class="toolbar-button"
                    type="button"
                    disabled
                  >
                    <span class="toolbar-button-icon" aria-hidden="true">
                      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7" /><path d="M21 4v6h-6" /></svg>
                    </span>
                    最新データを取得
                  </button>
                  <button
                    id="saveButton"
                    class="toolbar-button primary"
                    type="button"
                    disabled
                  >
                    <span class="toolbar-button-icon" aria-hidden="true">
                      <svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6" /></svg>
                    </span>
                    保存
                  </button>
                </div>
              </div>
            </div>
            <div class="member-switch-bar hidden" id="bossFilterArea">
              <div id="bossSearchControl" class="member-switch-list" role="group" aria-label="対象メンバー">
                <button
                  id="showAllSubordinatesButton"
                  class="member-switch-button is-active"
                  type="button"
                  data-member-scope="all"
                  aria-pressed="true"
                >
                  全員
                </button>
                <button
                  id="showSelfButton"
                  class="member-switch-button"
                  type="button"
                  data-member-scope="self"
                  aria-label="自分の日報"
                  aria-pressed="false"
                >
                  自分
                </button>
                <button
                  id="showTeamButton"
                  class="member-switch-button"
                  type="button"
                  data-member-scope="team"
                  aria-label="自チームの日報"
                  aria-pressed="false"
                >
                  自チーム
                </button>
                <button
                  id="showSubordinatesButton"
                  class="member-switch-button hidden"
                  type="button"
                  data-member-scope="subordinates"
                  aria-label="担当部下の日報"
                  aria-pressed="false"
                >
                  担当部下
                </button>
              </div>
            </div>
            <div id="tableWrap" class="table-card hidden"></div>
          </div>
          <section id="adminPanel" class="admin-panel hidden" aria-labelledby="adminTitle">
            <header class="admin-header">
              <div class="admin-heading">
                <div class="admin-title-line">
                  <h2 id="adminTitle">共通マスター</h2>
                  <span id="adminDirtyBadge" class="admin-dirty-badge hidden">変更なし</span>
                </div>
              </div>
              <div class="admin-header-actions">
                <button id="adminReloadButton" class="toolbar-button" type="button">
                  <span class="toolbar-button-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7" /><path d="M21 4v6h-6" /></svg>
                  </span>
                  再読み込み
                </button>
                <button id="adminSaveButton" class="toolbar-button primary" type="button" disabled>
                  <span class="toolbar-button-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6" /></svg>
                  </span>
                  変更を保存
                </button>
              </div>
            </header>

            <div id="adminLoading" class="admin-loading">
              <span class="admin-loading-mark" aria-hidden="true"></span>
              <p>共通マスターを読み込んでいます</p>
            </div>

            <div id="adminWorkspace" class="admin-workspace hidden">
              <aside class="master-rail" aria-label="共通マスターの種類">
                <div class="master-rail-heading">
                  <strong>データセット</strong>
                    <span>4 CSV</span>
                </div>
                <div id="masterNav" class="master-nav"></div>
                <div class="master-ledger">
                  <span>変更台帳</span>
                  <strong id="adminLedgerCount">変更はありません</strong>
                  <small>保存時に元ファイルをバックアップします</small>
                </div>
              </aside>

              <section class="master-table-pane" aria-labelledby="activeMasterTitle">
                <div class="master-table-toolbar">
                  <div>
                    <p id="activeMasterFile" class="master-file-name">user_master.csv</p>
                    <h3 id="activeMasterTitle">ユーザーマスター</h3>
                  </div>
                  <div class="master-table-tools">
                    <label class="master-search">
                      <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="11" cy="11" r="7" />
                        <path d="m20 20-4-4" />
                      </svg>
                      <span class="visually-hidden">行を検索</span>
                      <input id="adminSearchInput" type="search" placeholder="ID・名称で検索" autocomplete="off" />
                    </label>
                    <button id="adminAddRowButton" class="admin-add-button" type="button">
                      <span aria-hidden="true">＋</span>
                      行を追加
                    </button>
                  </div>
                </div>
                <div id="adminTableWrap" class="admin-table-wrap"></div>
                <footer class="master-table-footer">
                  <span id="adminRowCount">0件</span>
                  <span>行を選択すると右側で編集できます</span>
                </footer>
              </section>

              <aside id="masterInspector" class="master-inspector" aria-label="行の編集">
                <div id="adminInspectorEmpty" class="inspector-empty">
                  <span class="inspector-empty-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                      <path d="M4 4h16v16H4z" />
                      <path d="M8 9h8M8 13h6" />
                    </svg>
                  </span>
                  <h3>行を選択</h3>
                  <p>一覧から編集する行を選んでください。</p>
                </div>
                <div id="adminInspectorForm" class="inspector-form hidden"></div>
              </aside>
            </div>
          </section>
          <section id="settingsPanel" class="settings-panel hidden">
            <div class="settings-card">
              <div class="settings-header">
                <h2>設定</h2>
              </div>
              <label class="settings-field">
                <span>ユーザー日報フォルダ</span>
                <input id="usersDir" type="text" autocomplete="off" aria-describedby="usersDirError" />
                <span id="usersDirError" class="field-error hidden" role="alert"></span>
              </label>
              <label class="settings-field">
                <span>上司コメントフォルダ</span>
                <input id="commentsDir" type="text" autocomplete="off" aria-describedby="commentsDirError" />
                <span id="commentsDirError" class="field-error hidden" role="alert"></span>
              </label>
              <label class="settings-field">
                <span>共通マスターフォルダ</span>
                <input id="commonDir" type="text" autocomplete="off" aria-describedby="commonDirError" />
                <span id="commonDirError" class="field-error hidden" role="alert"></span>
              </label>
              <section class="default-range-setting" aria-labelledby="defaultRangeTitle">
                <div class="default-range-heading">
                  <div>
                    <h3 id="defaultRangeTitle">標準の表示範囲</h3>
                  </div>
                  <div class="default-range-values" aria-live="polite">
                    <span id="pastDaysValue">今日より1日前</span>
                    <span id="futureDaysValue">今日まで</span>
                  </div>
                </div>
                <div class="range-timeline">
                  <label class="range-half range-past">
                    <span class="range-side-label">開始</span>
                    <input
                      id="defaultStartOffsetDays"
                      type="range"
                      min="0"
                      max="14"
                      step="1"
                      value="1"
                      aria-label="今日より前に表示する日数"
                    />
                  </label>
                  <div class="range-today" aria-hidden="true">
                    <span>今日</span>
                    <strong id="rangeTodayDate"></strong>
                  </div>
                  <label class="range-half range-future">
                    <span class="range-side-label">終了</span>
                    <input
                      id="defaultEndOffsetDays"
                      type="range"
                      min="0"
                      max="7"
                      step="1"
                      value="0"
                      aria-label="今日より後に表示する日数"
                    />
                  </label>
                </div>
                <div class="range-scale" aria-hidden="true">
                  <span>14日前</span>
                  <span>7日前</span>
                  <span>今日</span>
                  <span>7日後</span>
                </div>
                <p id="defaultRangePreview" class="default-range-preview"></p>
              </section>
              <section class="missing-comment-setting" aria-labelledby="missingCommentSettingTitle">
                <div class="settings-section-heading">
                  <h3 id="missingCommentSettingTitle">未確認の集計</h3>
                  <p>「未確認のみ」の集計期間と、当日分の扱いを設定します。</p>
                </div>
                <label class="settings-field">
                  <span>集計を開始する日</span>
                  <input id="missingCommentStartDate" type="date" />
                </label>
                <label class="settings-check-option">
                  <input id="includeTodayInMissingComments" type="checkbox" />
                  <span class="settings-check-copy">
                    <strong>当日分を未確認日数に含める</strong>
                    <small>今日の日報も未確認バッジと絞り込みの対象にします。</small>
                  </span>
                </label>
              </section>
              <label class="settings-field">
                <span>サインの文字</span>
                <input
                  id="commentSignature"
                  type="text"
                  maxlength="100"
                  autocomplete="off"
                  placeholder="未設定の場合は上司名を使用"
                />
              </label>
              <div class="actions">
                <button
                  id="saveSettingsButton"
                  class="toolbar-button primary"
                  type="button"
                >
                  設定を保存
                </button>
              </div>
            </div>
          </section>
        </section>
      </main>
    </div>

    <script src="reports.js"></script>
    <script src="settings.js"></script>
    <script src="admin.js"></script>
    <script src="app.js"></script>
  </body>
</html>
