<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NIPPO — Apple-like design sample</title>
    <link rel="stylesheet" href="./apple-simple-tokens.css" />
    <style>
      /* Hallmark · genre: modern-minimal · macrostructure: Workbench · tone: calm Apple-like utility · anchor hue: Apple blue
       * designed-as-app · enrichment: none · pre-emit critique: P5 H5 E5 S5 R5 V4 · contrast: pass (40–41) · mobile: pass by CSS inspection
       */
      *, *::before, *::after { box-sizing: border-box; }
      html, body { min-width: 0; min-height: 100%; overflow-x: clip; }
      body {
        margin: 0;
        background: var(--color-page);
        color: var(--color-body);
        font-family: var(--font-body);
        font-size: var(--text-sm);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      button, input, textarea { font: inherit; }
      button { white-space: nowrap; }
      button, [contenteditable="true"] { -webkit-tap-highlight-color: transparent; }
      button:focus-visible, [contenteditable="true"]:focus-visible {
        outline: 3px solid var(--color-accent);
        outline-offset: 2px;
      }
      button:disabled { cursor: not-allowed; opacity: 0.5; }
      button.is-loading { color: transparent; pointer-events: none; }
      button.is-loading::after {
        position: absolute;
        width: 14px;
        height: 14px;
        border: 2px solid var(--color-accent-ink);
        border-right-color: transparent;
        border-radius: var(--radius-pill);
        content: "";
        animation: spin 700ms linear infinite;
      }
      button.is-error { background: var(--color-error); color: var(--color-accent-ink); }
      button.is-success { background: var(--color-success); color: var(--color-accent-ink); }
      @keyframes spin { to { transform: rotate(360deg); } }

      .app-header {
        position: sticky;
        top: 0;
        z-index: 30;
        display: grid;
        grid-template-columns: minmax(12rem, 14rem) minmax(0, 1fr) auto;
        align-items: center;
        min-height: 64px;
        padding: var(--space-2xs) var(--space-md);
        border-bottom: var(--rule-thin) solid var(--color-rule);
        background: var(--color-surface-frosted);
        backdrop-filter: blur(18px) saturate(1.35);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: var(--space-2xs);
        min-width: 0;
        color: var(--color-ink);
        font-size: var(--text-md);
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .brand-mark {
        display: grid;
        width: 32px;
        height: 32px;
        place-items: center;
        border-radius: 9px;
        background: var(--color-accent);
        color: var(--color-accent-ink);
        box-shadow: 0 1px 2px var(--color-shadow);
      }
      .brand-mark svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; }
      .header-title {
        min-width: 0;
        overflow: hidden;
        color: var(--color-ink);
        font-size: var(--text-base);
        font-weight: 650;
        text-align: center;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .user-menu {
        display: flex;
        align-items: center;
        gap: var(--space-2xs);
        min-height: 44px;
        padding: 0 var(--space-xs);
        border: 0;
        border-radius: var(--radius-pill);
        background: transparent;
        color: var(--color-body);
        font-weight: 600;
      }
      .avatar {
        display: grid;
        width: 30px;
        height: 30px;
        place-items: center;
        border-radius: var(--radius-pill);
        background: var(--color-accent-soft);
        color: var(--color-accent);
        font-size: var(--text-xs);
        font-weight: 750;
      }
      .user-menu:hover { background: var(--color-page-deep); }
      .user-menu:active { transform: scale(0.98); }

      .app-shell {
        display: grid;
        grid-template-columns: 208px minmax(0, 1fr);
        min-height: calc(100vh - 64px);
      }
      .sidebar {
        display: flex;
        flex-direction: column;
        padding: var(--space-sm) var(--space-xs);
        border-right: var(--rule-thin) solid var(--color-rule);
        background: var(--color-surface);
      }
      .nav-list { display: grid; gap: var(--space-3xs); margin: 0; padding: 0; list-style: none; }
      .nav-spacer { flex: 1; min-height: var(--space-lg); }
      .nav-button {
        display: flex;
        width: 100%;
        min-height: 44px;
        align-items: center;
        gap: var(--space-xs);
        padding: 0 var(--space-xs);
        border: 0;
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--color-body);
        font-weight: 600;
        text-align: left;
        transition: transform var(--dur-micro) var(--ease-out), background-color var(--dur-micro) var(--ease-out);
      }
      .nav-button svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; }
      .nav-button:hover { background: var(--color-page); }
      .nav-button:active { transform: scale(0.985); }
      .nav-button.is-active { background: var(--color-accent-soft); color: var(--color-accent); }

      .main { min-width: 0; padding: var(--space-md); }
      .workspace { max-width: 1500px; margin: 0 auto; }
      .page-heading {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: var(--space-md);
        margin-bottom: var(--space-sm);
      }
      .page-heading h1 {
        min-width: 0;
        margin: 0;
        color: var(--color-ink);
        font-family: var(--font-display);
        font-size: var(--text-xl);
        font-style: normal;
        font-weight: 720;
        letter-spacing: -0.035em;
        line-height: 1.2;
        overflow-wrap: anywhere;
      }
      .page-heading p { margin: var(--space-3xs) 0 0; color: var(--color-muted); }
      .actions { display: flex; align-items: center; gap: var(--space-2xs); }
      .button {
        position: relative;
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        gap: var(--space-2xs);
        padding: 0 var(--space-sm);
        border: var(--rule-thin) solid var(--color-rule);
        border-radius: var(--radius-sm);
        background: var(--color-surface);
        color: var(--color-body);
        font-weight: 650;
        box-shadow: 0 1px 2px var(--color-shadow);
        transition: transform var(--dur-micro) var(--ease-out), background-color var(--dur-micro) var(--ease-out);
      }
      .button:hover { background: var(--color-page); }
      .button:active { transform: scale(0.98); }
      .button.primary { border-color: var(--color-accent); background: var(--color-accent); color: var(--color-accent-ink); }
      .button.primary:hover { background: var(--color-accent-hover); }
      .button svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; }

      .filter-card {
        display: flex;
        align-items: center;
        gap: var(--space-xs);
        min-width: 0;
        margin-bottom: var(--space-xs);
        padding: var(--space-xs);
        border: var(--rule-thin) solid var(--color-rule);
        border-radius: var(--radius-md);
        background: var(--color-surface);
        box-shadow: 0 1px 2px var(--color-shadow);
      }
      .period-field {
        display: flex;
        min-height: 44px;
        align-items: center;
        gap: var(--space-2xs);
        padding: 0 var(--space-xs);
        border-radius: var(--radius-sm);
        background: var(--color-page);
        color: var(--color-ink);
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        white-space: nowrap;
      }
      .segmented {
        display: grid;
        grid-template-columns: repeat(4, minmax(44px, auto));
        gap: var(--space-3xs);
        min-height: 44px;
        padding: 2px;
        border-radius: var(--radius-sm);
        background: var(--color-page-deep);
      }
      .segment {
        min-height: 40px;
        padding: 0 var(--space-xs);
        border: 0;
        border-radius: calc(var(--radius-sm) - 2px);
        background: transparent;
        color: var(--color-muted);
        font-weight: 650;
      }
      .segment:hover { color: var(--color-ink); }
      .segment:active { transform: scale(0.97); }
      .segment.is-active { background: var(--color-surface); color: var(--color-ink); box-shadow: 0 1px 3px var(--color-shadow); }
      .period-nav { display: flex; margin-left: auto; gap: var(--space-3xs); }
      .icon-button {
        display: grid;
        width: 44px;
        height: 44px;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: var(--radius-pill);
        background: transparent;
        color: var(--color-accent);
      }
      .icon-button:hover { background: var(--color-accent-soft); }
      .icon-button:active { transform: scale(0.94); }
      .icon-button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }

      .table-card {
        min-width: 0;
        overflow: hidden;
        border: var(--rule-thin) solid var(--color-rule);
        border-radius: var(--radius-md);
        background: var(--color-surface);
        box-shadow: var(--shadow-card);
      }
      .table-scroll { min-width: 0; overflow: auto; }
      table { width: 100%; min-width: 1040px; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
      th, td { border-right: var(--rule-thin) solid var(--color-rule); border-bottom: var(--rule-thin) solid var(--color-rule); text-align: left; }
      th:last-child, td:last-child { border-right: 0; }
      tbody tr:last-child td { border-bottom: 0; }
      th {
        height: 42px;
        padding: 0 var(--space-xs);
        background: var(--color-page);
        color: var(--color-muted);
        font-size: var(--text-xs);
        font-weight: 700;
        white-space: nowrap;
      }
      td { height: 58px; padding: 0; background: var(--color-surface); color: var(--color-body); vertical-align: top; }
      .date-col { width: 92px; text-align: center; }
      .name-col { width: 220px; }
      .detail-col { width: 400px; }
      .comment-col { width: auto; }
      .cell { min-height: 58px; padding: var(--space-xs); white-space: pre-wrap; }
      .date-cell { display: grid; place-items: center; align-content: center; gap: 1px; font-variant-numeric: tabular-nums; font-weight: 650; }
      .date-cell small { color: var(--color-muted); font-size: var(--text-xs); font-weight: 500; }
      tr.today td { background: var(--color-accent-soft); }
      tr.today .date-cell { color: var(--color-accent); }
      tr.holiday td { background: var(--color-page); }
      .editable { cursor: text; transition: background-color var(--dur-micro) var(--ease-out); }
      .editable:hover { background: var(--color-page); box-shadow: inset 0 0 0 1px var(--color-rule-strong); }
      .editable:focus { background: var(--color-surface); box-shadow: inset 0 0 0 2px var(--color-accent); outline: 0; }
      .editable.is-dirty { background: var(--color-dirty); }
      .empty { color: var(--color-muted); }
      .comment-action {
        min-height: 36px;
        padding: 0 var(--space-xs);
        border: 0;
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--color-accent);
        font-size: var(--text-xs);
        font-weight: 650;
      }
      .comment-action:hover { background: var(--color-accent-soft); }
      .comment-action:active { transform: scale(0.97); }
      .save-note { display: flex; align-items: center; gap: var(--space-2xs); margin: var(--space-xs) var(--space-3xs) 0; color: var(--color-muted); font-size: var(--text-xs); }
      .save-dot { width: 7px; height: 7px; border-radius: var(--radius-pill); background: var(--color-success); }

      @media (max-width: 860px) {
        .app-header { grid-template-columns: minmax(0, 1fr) auto; padding-inline: var(--space-sm); }
        .header-title { display: none; }
        .app-shell { grid-template-columns: 1fr; padding-bottom: 70px; }
        .sidebar {
          position: fixed;
          right: var(--space-xs);
          bottom: max(var(--space-xs), env(safe-area-inset-bottom));
          left: var(--space-xs);
          z-index: 40;
          display: grid;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          padding: var(--space-2xs);
          border: var(--rule-thin) solid var(--color-rule);
          border-radius: var(--radius-lg);
          background: var(--color-surface-frosted);
          box-shadow: var(--shadow-float);
          backdrop-filter: blur(18px) saturate(1.35);
        }
        .sidebar .nav-list { display: contents; }
        .sidebar .nav-spacer { display: none; }
        .nav-button { justify-content: center; padding-inline: var(--space-2xs); }
        .nav-button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .main { padding: var(--space-sm); }
        .page-heading { align-items: flex-start; }
        .page-heading p { display: none; }
        .filter-card { flex-wrap: wrap; }
        .period-nav { margin-left: 0; }
      }
      @media (max-width: 560px) {
        .user-menu > span:not(.avatar) { display: none; }
        .main { padding: var(--space-xs); }
        .page-heading { display: grid; grid-template-columns: minmax(0, 1fr); }
        .actions { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
        .button { min-width: 0; padding-inline: var(--space-xs); }
        .button .button-label-long { display: none; }
        .filter-card { display: grid; grid-template-columns: minmax(0, 1fr) auto; }
        .period-field { grid-column: 1 / -1; justify-content: center; }
        .segmented { grid-template-columns: repeat(4, minmax(0, 1fr)); min-width: 0; }
        .segment { min-width: 0; padding-inline: var(--space-2xs); }
        .nav-button { flex-direction: column; gap: 0; min-height: 52px; font-size: var(--text-xs); }
        .nav-button svg { width: 18px; height: 18px; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 1ms !important; transition-duration: 1ms !important; }
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M7 3h10a2 2 0 0 1 2 2v14H5V5a2 2 0 0 1 2-2Z"/><path d="M8 8h8M8 12h5"/></svg>
        </span>
        <span>NIPPO</span>
      </div>
      <div class="header-title">日報</div>
      <button class="user-menu" type="button" aria-label="ユーザーメニュー">
        <span class="avatar" aria-hidden="true">山</span>
        <span>山田 太郎</span>
      </button>
    </header>

    <div class="app-shell">
      <aside class="sidebar" aria-label="メインメニュー">
        <ul class="nav-list">
          <li><button class="nav-button is-active" type="button" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4 20h16M7 16l9-9 2 2-9 9-3 1Z"/></svg><span>日報</span></button></li>
        </ul>
        <div class="nav-spacer"></div>
        <ul class="nav-list">
          <li><button class="nav-button" type="button"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v7c0 1.7 3.1 3 7 3s7-1.3 7-3V5M5 12v7c0 1.7 3.1 3 7 3s7-1.3 7-3v-7"/></svg><span>共通マスター</span></button></li>
          <li><button class="nav-button" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H3v-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3h4a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg><span>設定</span></button></li>
        </ul>
      </aside>

      <main class="main">
        <div class="workspace">
          <div class="page-heading">
            <div>
              <h1>日報</h1>
              <p>セルを選択して、そのまま入力できます。</p>
            </div>
            <div class="actions">
              <button class="button" type="button" id="refreshButton"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v6h-6"/></svg><span class="button-label-long">最新データを</span>取得</button>
              <button class="button primary" type="button" id="saveButton" disabled><svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>保存</button>
            </div>
          </div>

          <div class="filter-card">
            <div class="period-field" aria-label="表示期間"><span>2026/08/04</span><span>–</span><span>2026/08/10</span></div>
            <div class="segmented" role="group" aria-label="表示期間">
              <button class="segment" type="button">月</button>
              <button class="segment is-active" type="button" aria-pressed="true">週</button>
              <button class="segment" type="button">日</button>
              <button class="segment" type="button">設定</button>
            </div>
            <div class="period-nav" aria-label="期間を移動">
              <button class="icon-button" type="button" aria-label="前の期間"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
              <button class="icon-button" type="button" aria-label="次の期間"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
            </div>
          </div>

          <div class="table-card">
            <div class="table-scroll">
              <table>
                <thead><tr><th class="date-col">日付</th><th class="name-col">業務名</th><th class="detail-col">業務詳細</th><th class="comment-col">上司コメント</th></tr></thead>
                <tbody>
                  <tr>
                    <td><div class="cell date-cell">8/4<small>月</small></div></td>
                    <td><div class="cell editable" contenteditable="true" role="textbox" aria-label="8月4日の業務名">月次資料の作成</div></td>
                    <td><div class="cell editable" contenteditable="true" role="textbox" aria-label="8月4日の業務詳細">売上実績を集計し、部門別の差異を確認。</div></td>
                    <td><div class="cell"><button class="comment-action" type="button">コメントを追加</button></div></td>
                  </tr>
                  <tr class="today">
                    <td><div class="cell date-cell">8/5<small>火・今日</small></div></td>
                    <td><div class="cell editable" contenteditable="true" role="textbox" aria-label="8月5日の業務名">定例会議</div></td>
                    <td><div class="cell editable" contenteditable="true" role="textbox" aria-label="8月5日の業務詳細">進捗共有と次週の担当確認。</div></td>
                    <td><div class="cell">確認しました。次回は課題も併記してください。</div></td>
                  </tr>
                  <tr>
                    <td><div class="cell date-cell">8/6<small>水</small></div></td>
                    <td><div class="cell editable empty" contenteditable="true" role="textbox" aria-label="8月6日の業務名">クリックして入力</div></td>
                    <td><div class="cell editable empty" contenteditable="true" role="textbox" aria-label="8月6日の業務詳細">クリックして入力</div></td>
                    <td><div class="cell"><button class="comment-action" type="button">コメントを追加</button></div></td>
                  </tr>
                  <tr class="holiday">
                    <td><div class="cell date-cell">8/9<small>日</small></div></td>
                    <td><div class="cell"></div></td><td><div class="cell"></div></td><td><div class="cell"></div></td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
          <p class="save-note" id="saveNote"><span class="save-dot" aria-hidden="true"></span>すべての変更を保存済み</p>
        </div>
      </main>
    </div>

    <script>
      const saveButton = document.querySelector('#saveButton');
      const saveNote = document.querySelector('#saveNote');
      document.querySelectorAll('.segment').forEach((button) => {
        button.addEventListener('click', () => {
          document.querySelectorAll('.segment').forEach((item) => {
            item.classList.toggle('is-active', item === button);
            item.setAttribute('aria-pressed', String(item === button));
          });
        });
      });
      document.querySelectorAll('.editable').forEach((cell) => {
        cell.addEventListener('focus', () => {
          if (cell.classList.contains('empty')) {
            cell.textContent = '';
            cell.classList.remove('empty');
          }
        });
        cell.addEventListener('input', () => {
          cell.classList.add('is-dirty');
          saveButton.disabled = false;
          saveNote.innerHTML = '<span class="save-dot" aria-hidden="true"></span>未保存の変更があります';
        });
      });
      saveButton.addEventListener('click', () => {
        saveButton.classList.add('is-loading');
        saveButton.setAttribute('aria-label', '保存中');
        window.setTimeout(() => {
          document.querySelectorAll('.editable').forEach((cell) => cell.classList.remove('is-dirty'));
          saveButton.classList.remove('is-loading');
          saveButton.classList.add('is-success');
          saveButton.textContent = '保存済み';
          saveButton.setAttribute('aria-label', '保存済み');
          saveNote.innerHTML = '<span class="save-dot" aria-hidden="true"></span>すべての変更を保存済み';
          window.setTimeout(() => {
            saveButton.classList.remove('is-success');
            saveButton.textContent = '保存';
            saveButton.removeAttribute('aria-label');
            saveButton.disabled = true;
          }, 900);
        }, 500);
      });
    </script>
  </body>
</html>
