<!doctype html>
<html lang="ja" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NIPPO - YouTube型サイドバー／ダークテーマ案</title>
    <style>
      :root {
        color-scheme: light;
        --canvas: #f7f7f8;
        --topbar: #ffffff;
        --sidebar: #f3f3f4;
        --surface: #ffffff;
        --surface-subtle: #f1f1f2;
        --surface-hover: #ebebed;
        --surface-active: #e4e4e6;
        --text: #242424;
        --text-strong: #111111;
        --text-muted: #686868;
        --border: #dedee1;
        --border-strong: #b8b8bc;
        --action: #181818;
        --action-hover: #303030;
        --action-text: #ffffff;
        --focus: #56565b;
        --avatar: #e4e4e6;
        --shadow: 0 8px 28px rgb(20 20 20 / 7%);
        --sidebar-open: 224px;
        --sidebar-closed: 80px;
        --topbar-height: 56px;
        --radius-sm: 8px;
        --radius-md: 12px;
        --font: "Segoe UI", "Yu Gothic UI", "Hiragino Kaku Gothic ProN", Arial, sans-serif;
      }

      html[data-theme="dark"] {
        color-scheme: dark;
        --canvas: #212121;
        --topbar: #131313;
        --sidebar: #0d0d0d;
        --surface: #212121;
        --surface-subtle: #282828;
        --surface-hover: #292929;
        --surface-active: #303030;
        --text: #dcdcdc;
        --text-strong: #f3f3f3;
        --text-muted: #afafaf;
        --border: rgb(255 255 255 / 12%);
        --border-strong: rgb(255 255 255 / 25%);
        --action: #f3f3f3;
        --action-hover: #ffffff;
        --action-text: #131313;
        --focus: #d0d0d0;
        --avatar: #303030;
        --shadow: 0 10px 34px rgb(0 0 0 / 24%);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        min-width: 0;
        min-height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: var(--canvas);
        color: var(--text);
        font-family: var(--font);
        font-size: 14px;
        line-height: 1.5;
      }

      button,
      input {
        font: inherit;
      }

      button {
        border: 0;
        cursor: pointer;
      }

      :is(button, input):focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }

      .app {
        display: grid;
        height: 100vh;
        grid-template-rows: var(--topbar-height) minmax(0, 1fr);
      }

      .topbar {
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--border);
        background: var(--topbar);
        padding: 0 18px 0 10px;
      }

      .topbar-leading {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .sidebar-toggle {
        display: grid;
        width: 36px;
        height: 36px;
        place-items: center;
        border-radius: 10px;
        background: transparent;
        color: var(--text);
      }

      .sidebar-toggle:hover {
        background: var(--surface-hover);
        color: var(--text-strong);
      }

      .sidebar-toggle svg {
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-width: 1.8;
      }

      .brand {
        color: var(--text-strong);
        font-size: 16px;
        font-weight: 800;
        letter-spacing: 0.08em;
      }

      .theme-switch {
        display: inline-flex;
        gap: 2px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface-subtle);
        padding: 3px;
      }

      .theme-button {
        min-height: 30px;
        border-radius: 7px;
        background: transparent;
        color: var(--text-muted);
        padding: 0 11px;
        font-size: 12px;
        font-weight: 600;
      }

      .theme-button:hover {
        background: var(--surface-hover);
        color: var(--text-strong);
      }

      .theme-button.is-active {
        background: var(--surface);
        color: var(--text-strong);
        box-shadow: 0 1px 4px rgb(0 0 0 / 10%);
      }

      .shell {
        display: grid;
        min-width: 0;
        min-height: 0;
        grid-template-columns: var(--sidebar-open) minmax(0, 1fr);
        transition: grid-template-columns 0.16s ease;
      }

      .shell.is-sidebar-collapsed {
        grid-template-columns: var(--sidebar-closed) minmax(0, 1fr);
      }

      .sidebar {
        display: flex;
        min-height: 0;
        flex-direction: column;
        align-items: center;
        overflow: hidden;
        border-right: 1px solid var(--border);
        background: var(--sidebar);
        padding: 6px 4px 8px;
      }

      .sidebar-nav,
      .sidebar-bottom {
        display: grid;
        width: 100%;
        gap: 2px;
        padding: 0 8px;
      }

      .sidebar-spacer {
        min-height: 16px;
        flex: 1 1 auto;
      }

      .nav-item,
      .user-item {
        display: flex;
        width: 100%;
        align-items: center;
        justify-content: flex-start;
        flex-direction: row;
        gap: 14px;
        border-radius: 10px;
        background: transparent;
        color: var(--text);
        padding: 0 14px;
        text-align: left;
      }

      .nav-item {
        height: 50px;
      }

      .nav-item:hover,
      .user-item:hover {
        background: var(--surface-hover);
        color: var(--text-strong);
      }

      .nav-item.is-active {
        background: var(--surface-active);
        color: var(--text-strong);
      }

      .nav-icon {
        display: grid;
        width: 28px;
        height: 28px;
        flex: 0 0 28px;
        place-items: center;
      }

      .nav-icon svg {
        width: 28px;
        height: 28px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.7;
      }

      .nav-label {
        display: block;
        min-width: 0;
        overflow: hidden;
        font-size: 14px;
        font-weight: 500;
        line-height: 1.2;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .sidebar-divider {
        width: calc(100% - 16px);
        height: 1px;
        margin: 4px 0;
        background: var(--border);
      }

      .user-item {
        min-height: 52px;
        color: var(--text-muted);
        padding: 6px 14px;
      }

      .user-avatar {
        display: grid;
        width: 28px;
        height: 28px;
        place-items: center;
        border: 1px solid var(--border);
        border-radius: 50%;
        background: var(--avatar);
        color: var(--text-strong);
        font-size: 11px;
        font-weight: 700;
      }

      .shell.is-sidebar-collapsed :is(.sidebar-nav, .sidebar-bottom) {
        width: 72px;
        padding: 0;
      }

      .shell.is-sidebar-collapsed :is(.nav-item, .user-item) {
        width: 72px;
        justify-content: center;
        flex-direction: column;
        gap: 6px;
        padding: 0 2px;
        text-align: center;
      }

      .shell.is-sidebar-collapsed .nav-item {
        height: 80px;
      }

      .shell.is-sidebar-collapsed .user-item {
        min-height: 72px;
      }

      .shell.is-sidebar-collapsed .nav-label {
        width: 68px;
        font-size: 10px;
        line-height: 1.15;
      }

      .shell.is-sidebar-collapsed .sidebar-divider {
        width: 54px;
      }

      .main {
        min-width: 0;
        min-height: 0;
        overflow: auto;
        background: var(--canvas);
        padding: 22px clamp(18px, 3vw, 42px) 40px;
      }

      .workspace {
        width: min(1460px, 100%);
        margin: 0 auto;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 14px;
      }

      .toolbar-group,
      .segmented,
      .filter-row {
        display: flex;
        align-items: center;
      }

      .toolbar-group {
        min-width: 0;
        flex-wrap: wrap;
        gap: 8px;
      }

      .segmented {
        gap: 2px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface-subtle);
        padding: 3px;
      }

      .segmented button {
        min-width: 38px;
        min-height: 30px;
        border-radius: 7px;
        background: transparent;
        color: var(--text-muted);
        font-size: 12px;
        font-weight: 600;
      }

      .segmented button:hover {
        background: var(--surface-hover);
        color: var(--text-strong);
      }

      .segmented button.is-active {
        background: var(--surface);
        color: var(--text-strong);
        box-shadow: 0 1px 4px rgb(0 0 0 / 10%);
      }

      .date-control,
      .secondary-button,
      .primary-button,
      .filter-button {
        min-height: 36px;
        border-radius: var(--radius-sm);
        padding: 0 12px;
        white-space: nowrap;
      }

      .date-control,
      .secondary-button,
      .filter-button {
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
      }

      .date-control {
        min-width: 230px;
      }

      .secondary-button:hover,
      .filter-button:hover {
        border-color: var(--border-strong);
        background: var(--surface-hover);
      }

      .primary-button {
        background: var(--action);
        color: var(--action-text);
        font-weight: 600;
      }

      .primary-button:hover {
        background: var(--action-hover);
      }

      .filter-row {
        gap: 7px;
        margin-bottom: 12px;
      }

      .filter-button.is-active {
        border-color: var(--border-strong);
        background: var(--surface-active);
        color: var(--text-strong);
      }

      .table-card {
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      table {
        width: 100%;
        min-width: 980px;
        border-collapse: collapse;
        table-layout: fixed;
      }

      th,
      td {
        height: 46px;
        border-right: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
        padding: 8px 11px;
        text-align: left;
        vertical-align: middle;
      }

      th:last-child,
      td:last-child {
        border-right: 0;
      }

      tbody tr:last-child td {
        border-bottom: 0;
      }

      th {
        background: var(--surface-subtle);
        color: var(--text-muted);
        font-size: 12px;
        font-weight: 700;
      }

      td {
        color: var(--text);
        font-weight: 400;
      }

      tbody td:hover {
        background: var(--surface-hover);
      }

      .date-column {
        width: 128px;
        color: var(--text-strong);
      }

      .member-column {
        width: 150px;
      }

      .comment-column {
        width: 260px;
      }

      .muted {
        color: var(--text-muted);
      }

      .proposal-note {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        margin-top: 14px;
        border-radius: var(--radius-sm);
        background: var(--surface-subtle);
        color: var(--text-muted);
        padding: 11px 13px;
        font-size: 12px;
      }

      .proposal-note strong {
        color: var(--text);
      }

      @media (max-width: 820px) {
        .theme-button span,
        .toolbar .primary-button {
          display: none;
        }

        .main {
          padding-right: 14px;
          padding-left: 14px;
        }

        .toolbar {
          align-items: stretch;
          flex-direction: column;
        }

        .date-control {
          flex: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="topbar-leading">
          <button id="sidebarToggle" class="sidebar-toggle" type="button" aria-label="サイドバーを折りたたむ" aria-expanded="true" title="サイドバーを折りたたむ">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg>
          </button>
          <div class="brand">NIPPO</div>
        </div>
        <div class="theme-switch" role="group" aria-label="テーマ">
          <button class="theme-button is-active" type="button" data-theme-choice="light" aria-pressed="true">☀ <span>ライト</span></button>
          <button class="theme-button" type="button" data-theme-choice="dark" aria-pressed="false">◐ <span>ダーク</span></button>
        </div>
      </header>

      <div class="shell">
        <aside class="sidebar" aria-label="メインメニュー">
          <nav class="sidebar-nav">
            <button class="nav-item is-active" type="button" title="日報" aria-label="日報">
              <span class="nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M6 3.5h9l3 3V20.5H6z"/><path d="M15 3.5v4h4M9 11h6M9 15h6"/></svg>
              </span>
              <span class="nav-label">日報</span>
            </button>
          </nav>

          <div class="sidebar-spacer"></div>

          <nav class="sidebar-bottom" aria-label="管理と設定">
            <button class="nav-item" type="button" title="共通マスター" aria-label="共通マスター">
              <span class="nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v6c0 1.7 3.1 3 7 3s7-1.3 7-3V5M5 11v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>
              </span>
              <span class="nav-label">共通マスター</span>
            </button>
            <button class="nav-item" type="button" title="設定" aria-label="設定">
              <span class="nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.5 1a8 8 0 0 0-2-.9L14 3h-4l-.4 2.9a8 8 0 0 0-2 .9l-2.5-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.5-1a8 8 0 0 0 2 .9L10 21h4l.4-2.9a8 8 0 0 0 2-.9l2.5 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg>
              </span>
              <span class="nav-label">設定</span>
            </button>
            <div class="sidebar-divider" aria-hidden="true"></div>
            <button class="user-item" type="button" title="山田 太郎" aria-label="ユーザーメニュー：山田 太郎">
              <span class="user-avatar" aria-hidden="true">山</span>
              <span class="nav-label">山田 太郎</span>
            </button>
          </nav>
        </aside>

        <main class="main">
          <div class="workspace">
            <div class="toolbar">
              <div class="toolbar-group">
                <div class="segmented" aria-label="表示期間">
                  <button type="button" class="is-active">月</button>
                  <button type="button">週</button>
                  <button type="button">日</button>
                </div>
                <input class="date-control" value="2026/08/01 - 2026/08/31" readonly aria-label="表示日付範囲" />
                <button class="secondary-button" type="button">‹</button>
                <button class="secondary-button" type="button">›</button>
                <button class="secondary-button" type="button">更新</button>
              </div>
              <button class="primary-button" type="button">変更を保存</button>
            </div>

            <div class="filter-row" aria-label="表示メンバー">
              <button class="filter-button is-active" type="button">全員</button>
              <button class="filter-button" type="button">山田 太郎</button>
              <button class="filter-button" type="button">佐藤 花子</button>
              <button class="filter-button" type="button">鈴木 一郎</button>
            </div>

            <section class="table-card" aria-label="日報一覧">
              <table>
                <thead>
                  <tr><th class="date-column">日付</th><th class="member-column">ユーザー</th><th>業務名</th><th>業務内容</th><th class="comment-column">コメント</th></tr>
                </thead>
                <tbody>
                  <tr><td class="date-column">2026/08/18</td><td>山田 太郎</td><td>管理画面改修</td><td>組織管理UIの調整</td><td class="muted">確認しました</td></tr>
                  <tr><td class="date-column">2026/08/18</td><td>佐藤 花子</td><td>API実装</td><td>保存処理のテスト</td><td class="muted">—</td></tr>
                  <tr><td class="date-column">2026/08/19</td><td>山田 太郎</td><td></td><td></td><td></td></tr>
                  <tr><td class="date-column">2026/08/19</td><td>鈴木 一郎</td><td></td><td></td><td></td></tr>
                  <tr><td class="date-column">2026/08/20</td><td>佐藤 花子</td><td></td><td></td><td></td></tr>
                </tbody>
              </table>
            </section>

            <div class="proposal-note">
              <span aria-hidden="true">i</span>
              <span><strong>比較用モックです。</strong> 左上のボタンでサイドバーを折りたたみ、右上のライト／ダークで配色を切り替えられます。ユーザー表示は左サイドバー最下段に固定しています。</span>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script>
      const root = document.documentElement;
      const shell = document.querySelector(".shell");
      const sidebarToggle = document.querySelector("#sidebarToggle");
      const themeButtons = [...document.querySelectorAll("[data-theme-choice]")];
      themeButtons.forEach((button) => {
        button.addEventListener("click", () => {
          const theme = button.dataset.themeChoice;
          root.dataset.theme = theme;
          themeButtons.forEach((candidate) => {
            const active = candidate === button;
            candidate.classList.toggle("is-active", active);
            candidate.setAttribute("aria-pressed", String(active));
          });
        });
      });

      sidebarToggle.addEventListener("click", () => {
        const collapsed = shell.classList.toggle("is-sidebar-collapsed");
        const label = collapsed ? "サイドバーを展開する" : "サイドバーを折りたたむ";
        sidebarToggle.setAttribute("aria-expanded", String(!collapsed));
        sidebarToggle.setAttribute("aria-label", label);
        sidebarToggle.title = label;
      });

      document.querySelectorAll(".nav-item").forEach((button) => {
        button.addEventListener("click", () => {
          document.querySelectorAll(".nav-item").forEach((candidate) => {
            candidate.classList.toggle("is-active", candidate === button);
          });
        });
      });
    </script>
  </body>
</html>
