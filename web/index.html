<!doctype html>
<html lang="ja" class="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NIPPO | Daily Report</title>

    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./reports.css" />
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body data-color-theme="green">
    <header class="title-bar">
      <div class="title-bar-brand">

          <svg

        </span>
        <span class="title-bar-title">NIPPO</span>
        <span class="title-bar-divider" aria-hidden="true"></span>
        <span class="title-bar-context">Daily Operations</span>
      </div>
      <div class="title-bar-actions" aria-label="アプリ操作">
        <span class="current-user-display">
          <span class="current-user-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="8" r="4" />
              <path d="M4 21a8 8 0 0 1 16 0" />
            </svg>
          </span>
          <span id="currentUserName" class="current-user">ユーザー</span>
        </span>
        <div id="fontSizeControl" class="font-size-control">
          <button
            id="fontSizeButton"
            class="header-icon-button font-size-button"
            type="button"
            title="文字サイズを変更"
            aria-label="文字サイズを変更"
            aria-haspopup="true"
            aria-expanded="false"
          >
            Aa
          </button>
          <div
            id="fontSizeMenu"
            class="font-size-menu hidden"
            role="group"
            aria-label="文字サイズ"
          >
            <button type="button" data-font-size="standard" aria-pressed="true">標準</button>
            <button type="button" data-font-size="large" aria-pressed="false">大</button>
            <button type="button" data-font-size="xlarge" aria-pressed="false">特大</button>
          </div>
        </div>
        <button
          id="toggleThemeButton"
          class="header-icon-button"
          type="button"
          title="ダークモードに切替"
          aria-label="ダークモードに切替"
          aria-pressed="false"
        >
          <svg viewBox="0 0 24 24" role="img" aria-hidden="true">
            <path d="M12 3a6 6 0 0 0 9 7.8A8.5 8.5 0 1 1 12 3z" />
          </svg>
        </button>
      </div>
    </header>

    <div class="app-shell">
      <aside id="sidebar" class="sidebar is-open">
        <nav class="sidebar-nav" aria-label="メインメニュー">
          <ul>
            <li>
              <button
                id="dailyViewButton"
                class="sidebar-item is-active"
                type="button"
                title="日報入力"
              >
                <span class="sidebar-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" role="img">
                    <path d="M12 20h9" />
                    <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
                  </svg>
                </span>
                <span class="sidebar-text">日報入力</span>
              </button>
            </li>
            <li>
              <button
                id="bossViewButton"
                class="sidebar-item"
                type="button"
                title="上司コメント"
              >
                <span class="sidebar-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" role="img">
                    <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4Z" />
                    <path d="M8 9h8M8 13h5" />
                  </svg>
                </span>
                <span class="sidebar-text">上司コメント</span>
              </button>
            </li>
          </ul>
        </nav>
        <nav class="sidebar-secondary-nav" aria-label="アプリ設定">
          <button
            id="openSettingsButton"
            class="sidebar-item"
            type="button"
            title="設定"
          >
            <span class="sidebar-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="img">
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.51a2 2 0 0 1 1-1.72l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </span>
            <span class="sidebar-text">設定</span>
          </button>
        </nav>
        <div id="sidebar-toggle-container" class="sidebar-footer">
          <button
            id="toggleSidebarButton"
            class="sidebar-utility-button sidebar-toggle"
            type="button"
            title="サイドバーを閉じる"
            aria-label="サイドバー切替"
          >
            <span class="sidebar-toggle-icon" aria-hidden="true"></span>
            <span class="sidebar-utility-text">折りたたむ</span>
          </button>
        </div>
      </aside>

      <main class="main-area">
        <div id="statusRegion" class="status-region" aria-live="polite">
          <div id="message" class="message hidden" role="status"></div>
        </div>
        <section id="mainPanel" class="content">
          <div id="reportPanel" class="workspace-card">
            <div class="report-toolbar">
              <div class="toolbar-row toolbar-heading-row">
                <div class="view-label">
                  <span id="pageTitle">日報入力</span>
                  <span id="pageDescription" class="page-description">
                    自分の日報を入力し、コメントを確認
                  </span>
                </div>

                <div class="toolbar-right">
                  <button
                    id="refreshButton"
                    class="toolbar-button"
                    type="button"
                    disabled
                  >
                    <span class="toolbar-button-icon" aria-hidden="true">
                      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7" /><path d="M21 4v6h-6" /></svg>
                    </span>
                    最新データを取得
                  </button>
                  <button
                    id="saveButton"
                    class="toolbar-button primary"
                    type="button"
                    disabled
                  >
                    <span class="toolbar-button-icon" aria-hidden="true">
                      <svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6" /></svg>
                    </span>
                    保存
                  </button>
                </div>
              </div>

              <div class="toolbar-row toolbar-filter-row">
                <div class="toolbar-left toolbar-left-wide">
                  <div class="period-main-controls">
                    <div class="period-control-container">
                      <div class="period-control">
                        <div class="period-field-group">
                          <input id="startDate" type="date" aria-label="開始日" aria-describedby="periodError" />
                        </div>
                        <span class="period-separator">〜</span>
                        <div class="period-field-group">
                          <input id="endDate" type="date" aria-label="終了日" aria-describedby="periodError" />
                        </div>
                      </div>
                      <div id="periodError" class="field-error period-error hidden" role="alert"></div>
                    </div>
                    <div class="period-presets" aria-label="設定した表示範囲">
                      <button id="presetDefaultButton" class="preset-button" type="button">標準範囲</button>
                      <button
                        id="showMissingCommentsButton"
                        class="preset-button hidden"
                        type="button"
                        aria-pressed="false"
                      >
                        未確認
                      </button>
                    </div>
                  </div>
                  <div class="period-shortcuts" aria-label="補助の表示範囲">
                    <div class="period-shortcut-group" role="group" aria-label="日単位">
                      <button
                        id="presetPreviousWorkdayButton"
                        class="preset-button"
                        type="button"
                        title="休日設定日を除いた直近の前日を表示"
                      >
                        1稼働日前
                      </button>
                      <button id="presetTodayButton" class="preset-button" type="button">本日</button>
                    </div>
                    <div class="period-shortcut-group" role="group" aria-label="週単位（月曜始まり）">
                      <button id="presetPreviousWeekButton" class="preset-button" type="button">先週</button>
                      <button id="presetThisWeekButton" class="preset-button" type="button">今週</button>
                    </div>
                    <div class="period-shortcut-group" role="group" aria-label="月単位">
                      <button id="presetPreviousMonthButton" class="preset-button" type="button">先月</button>
                      <button id="presetThisMonthButton" class="preset-button" type="button">今月</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="member-switch-bar hidden" id="bossFilterArea">
              <span class="member-switch-label">対象メンバー</span>
              <div id="bossSearchControl" class="member-switch-list">
                <button
                  id="showAllSubordinatesButton"
                  class="member-switch-button is-active"
                  type="button"
                  aria-pressed="true"
                >
                  全員
                </button>
              </div>
            </div>
            <div id="tableWrap" class="table-card hidden"></div>
          </div>
          <section id="settingsPanel" class="settings-panel hidden">
            <div class="settings-card">
              <div class="settings-header">
                <h2>設定</h2>
              </div>
              <p class="settings-description">
                画面の表示と、日報データを読み書きする共有フォルダを設定します。
              </p>
              <section class="appearance-setting" aria-labelledby="appearanceSettingTitle">
                <div class="settings-section-heading">
                  <h3 id="appearanceSettingTitle">デザインカラー</h3>
                  <p>ボタンや選択中の項目、ナビゲーションの基調色を選び、設定を保存します。</p>
                </div>
                <div id="colorThemeOptions" class="color-theme-options" role="group" aria-label="デザインカラー">
                  <button
                    class="color-theme-option is-selected"
                    type="button"
                    data-color-theme="green"
                    aria-pressed="true"
                  >
                    <span class="color-theme-swatch" aria-hidden="true">
                      <span class="color-theme-swatch-shell"></span>
                      <span class="color-theme-swatch-accent"></span>
                    </span>
                    <span class="color-theme-option-copy">
                      <strong>グリーン</strong>
                      <small>標準</small>
                    </span>
                    <span class="color-theme-option-check" aria-hidden="true">✓</span>
                  </button>
                  <button
                    class="color-theme-option"
                    type="button"
                    data-color-theme="blue"
                    aria-pressed="false"
                  >
                    <span class="color-theme-swatch" aria-hidden="true">
                      <span class="color-theme-swatch-shell"></span>
                      <span class="color-theme-swatch-accent"></span>
                    </span>
                    <span class="color-theme-option-copy">
                      <strong>ブルー</strong>
                      <small>青系</small>
                    </span>
                    <span class="color-theme-option-check" aria-hidden="true">✓</span>
                  </button>
                  <button
                    class="color-theme-option"
                    type="button"
                    data-color-theme="orange"
                    aria-pressed="false"
                  >
                    <span class="color-theme-swatch" aria-hidden="true">
                      <span class="color-theme-swatch-shell"></span>
                      <span class="color-theme-swatch-accent"></span>
                    </span>
                    <span class="color-theme-option-copy">
                      <strong>オレンジ</strong>
                      <small>橙系</small>
                    </span>
                    <span class="color-theme-option-check" aria-hidden="true">✓</span>
                  </button>
                </div>
              </section>
              <label class="settings-field">
                <span>ユーザー日報フォルダ</span>
                <input id="usersDir" type="text" autocomplete="off" aria-describedby="usersDirError" />
                <span id="usersDirError" class="field-error hidden" role="alert"></span>
              </label>
              <label class="settings-field">
                <span>上司コメントフォルダ</span>
                <input id="commentsDir" type="text" autocomplete="off" aria-describedby="commentsDirError" />
                <span id="commentsDirError" class="field-error hidden" role="alert"></span>
              </label>
              <label class="settings-field">
                <span>共通マスターフォルダ</span>
                <input id="commonDir" type="text" autocomplete="off" aria-describedby="commonDirError" />
                <span id="commonDirError" class="field-error hidden" role="alert"></span>
              </label>
              <section class="default-range-setting" aria-labelledby="defaultRangeTitle">
                <div class="default-range-heading">
                  <div>
                    <h3 id="defaultRangeTitle">標準の表示範囲</h3>
                    <p>今日を基準に、前後何日分を表示するか設定します。</p>
                  </div>
                  <div class="default-range-values" aria-live="polite">
                    <span id="pastDaysValue">今日より1日前</span>
                    <span id="futureDaysValue">今日まで</span>
                  </div>
                </div>
                <div class="range-timeline">
                  <label class="range-half range-past">
                    <span class="range-side-label">開始</span>
                    <input
                      id="defaultStartOffsetDays"
                      type="range"
                      min="0"
                      max="14"
                      step="1"
                      value="1"
                      aria-label="今日より前に表示する日数"
                    />
                  </label>
                  <div class="range-today" aria-hidden="true">
                    <span>今日</span>
                    <strong id="rangeTodayDate"></strong>
                  </div>
                  <label class="range-half range-future">
                    <span class="range-side-label">終了</span>
                    <input
                      id="defaultEndOffsetDays"
                      type="range"
                      min="0"
                      max="7"
                      step="1"
                      value="0"
                      aria-label="今日より後に表示する日数"
                    />
                  </label>
                </div>
                <div class="range-scale" aria-hidden="true">
                  <span>14日前</span>
                  <span>7日前</span>
                  <span>今日</span>
                  <span>7日後</span>
                </div>
                <p id="defaultRangePreview" class="default-range-preview"></p>
              </section>
              <section class="missing-comment-setting" aria-labelledby="missingCommentSettingTitle">
                <div class="settings-section-heading">
                  <h3 id="missingCommentSettingTitle">未確認の集計</h3>
                  <p>未確認ボタンの集計期間と、当日分の扱いを設定します。</p>
                </div>
                <label class="settings-field">
                  <span>集計を開始する日</span>
                  <input id="missingCommentStartDate" type="date" />
                </label>
                <label class="settings-check-option">
                  <input id="includeTodayInMissingComments" type="checkbox" />
                  <span class="settings-check-copy">
                    <strong>当日分を未確認数に含める</strong>
                    <small>今日の日報も未確認バッジと未確認一覧の対象にします。</small>
                  </span>
                </label>
              </section>
              <label class="settings-field">
                <span>サインの文字</span>
                <input
                  id="commentSignature"
                  type="text"
                  maxlength="100"
                  autocomplete="off"
                  placeholder="未設定の場合は上司名を使用"
                />
              </label>
              <div class="actions">
                <button
                  id="saveSettingsButton"
                  class="toolbar-button primary"
                  type="button"
                >
                  設定を保存
                </button>
              </div>
            </div>
          </section>
        </section>
      </main>
    </div>

    <script src="reports.js"></script>
    <script src="settings.js"></script>
    <script src="app.js"></script>
  </body>
</html>
